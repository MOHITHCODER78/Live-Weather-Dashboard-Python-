<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Live Weather Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dark-theme auth-overlay-active">
    <!-- Original Dashboard Skeleton Behind Signup -->
    <div class="dashboard-wrapper">
        <header class="glass-header">
            <div class="logo"><i class="fas fa-satellite-dish"></i> <span>Live Weather <span>Dashboard</span></span></div>
            <div class="header-stats">
                <div class="stat-bubble extreme">Extreme: 0</div>
                <div class="stat-bubble severe">Severe: 0</div>
            </div>
        </header>
        <main class="dashboard-grid">
            <aside class="sidebar-left glass"></aside>
            <section class="map-container glass" style="display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.05)">
                <i class="fas fa-globe-americas fa-10x"></i>
            </section>
            <aside class="sidebar-right glass">
                <div class="metric-card glass"></div>
                <div class="chart-card glass"></div>
            </aside>
        </main>
        <footer class="status-bar glass"></footer>
    </div>

    <!-- Netflix Style Dynamic Overlay -->
    <div class="netflix-auth-bg">
        <div class="netflix-grid">
            {% for i in range(18) %}
            <div class="placeholder-poster">
                <i class="fas fa-satellite-dish fa-3x"></i>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="auth-page">
        <div class="auth-card">
            <div class="user-avatar-circle">
                <i class="fas fa-user-plus"></i>
            </div>
            
            <h2 style="margin-bottom: 8px; font-weight: 700; letter-spacing: -0.025em; color: white;">Create Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 32px;">Join our live weather monitoring network</p>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages" style="background: rgba(244, 63, 94, 0.1); color: var(--color-extreme); padding: 12px; border-radius: 8px; margin-bottom: 24px; font-size: 0.85rem; border: 1px solid rgba(244, 63, 94, 0.2);">
                    {{ messages[0] }}
                </div>
            {% endif %}
            {% endwith %}

            <form class="auth-form" method="POST" action="{{ url_for('auth.signup') }}">
                <div class="form-group">
                    <i class="fas fa-signature input-icon"></i>
                    <input type="text" name="name" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-id-badge input-icon"></i>
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock-open input-icon"></i>
                    <input type="password" name="password" placeholder="Create Password" required>
                </div>
                
                <button type="submit" class="auth-btn-netflix">Create Account</button>
            </form>

            <div style="margin-top: 32px; font-size: 0.85rem; color: var(--text-secondary);">
                Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--accent-blue); text-decoration: none; font-weight: 600; margin-left: 4px;">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>

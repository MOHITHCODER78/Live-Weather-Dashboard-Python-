databases:
  - name: weather-db
    databaseName: weather_intel
    user: weather_admin
    plan: free

services:
  - type: web
    name: live-weather-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: weather-db
          property: connectionString
    plan: free

